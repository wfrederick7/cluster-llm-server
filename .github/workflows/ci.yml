name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: |
          bash -n profiles/gpt-oss-120b.env scripts/setup_env.sh slurm/serve.sbatch
          shellcheck profiles/gpt-oss-120b.env scripts/setup_env.sh slurm/serve.sbatch
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
